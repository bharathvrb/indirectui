spring:
  h2:
    console:
      enabled: false
      
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

logging:
  level:
    com.orion.quotemanagement: INFO
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN

# Production specific settings
app:
  file-storage:
    path: /app/uploads
  mock-data:
    enabled: false
    generate-on-startup: false