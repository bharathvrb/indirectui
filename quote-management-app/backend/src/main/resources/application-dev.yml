spring:
  web:
    resources:
      static-locations: "file:../frontend/src/,file:../frontend/,classpath:/static/"
      cache:
        period: 0

  sql:
    init:
      mode: never

  datasource:
    url: jdbc:h2:mem:quotedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: password
    
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
        
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

logging:
  level:
    com.orion.quotemanagement: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# Development specific settings
app:
  file-storage:
    path: ./dev-uploads
  mock-data:
    enabled: true
    generate-on-startup: true
  cors:
    allowed-origins: http://localhost:8080,http://127.0.0.1:8080,http://localhost:8081,http://127.0.0.1:8081,http://localhost:3000