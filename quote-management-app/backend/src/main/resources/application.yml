spring:
  application:
    name: quote-management-backend
  
  profiles:
    active: dev
    
  datasource:
    url: jdbc:h2:mem:quotedb
    driverClassName: org.h2.Driver
    username: sa
    password: password
    
  h2:
    console:
      enabled: true
      path: /h2-console
      
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
      
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

  # -----------------------------------------------------------------------
  # Azure AD SSO — Comcast Identity Provider
  # Set AZURE_TENANT_ID and AZURE_CLIENT_ID environment variables before
  # starting the backend (see README-SSO.md for app registration steps).
  # Note: JWT decoder is configured in code (SecurityConfig.java) so that
  # the app starts without these values during development.
  # -----------------------------------------------------------------------

server:
  port: 8080
  servlet:
    context-path: /
    
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.orion.quotemanagement: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# Application specific configuration
app:
  file-storage:
    path: ./uploads
  cors:
    allowed-origins: http://localhost:8080,http://127.0.0.1:8080,http://localhost:8081,http://127.0.0.1:8081
  tmf648:
    api-version: v4
    base-path: /tmf-api/quote