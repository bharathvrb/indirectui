# Local server settings for the QuoteData workspace (loaded by `npm start`).
# Fill in the <...> values on your machine. Do NOT commit real secrets: after editing, run
#   git update-index --skip-worktree quote-management-app/frontend/server.properties
# so git ignores your local changes. Values still written as <...> are ignored by the server.
# Real environment variables override these values.

# QuoteData service account (OAuth client_credentials), from the requirement document.
QUOTEDATA_CLIENT_ID=orion_dev
QUOTEDATA_CLIENT_SECRET=<client_secret from the requirement document>
QUOTEDATA_SCOPE=orion:orion-dev
QUOTEDATA_TOKEN_URL=https://sat-ci.codebig2.net/v2/ws/token.oauth2
QUOTEDATA_BASE_URL=https://quotedata-flx.as-g8.cf.comcast.net/quotedata/v1
# If the QuoteData host only serves plain HTTP, switch the URL above to http:// and uncomment:
# QUOTEDATA_ALLOW_HTTP=true

# Step retry (future QuoteData API). Keep false until the retry endpoint exists, then also set
# APP_CONFIG.features.retryEnabled = true in src/config.js.
QUOTEDATA_RETRY_ENABLED=false

# SSO sign-in verification. Must match AUTH_CONFIG.clientId / tenantId in src/config.js.
SSO_CLIENT_ID=ae57677b-0389-4a92-bbf5-078156e0886b
SSO_TENANT_ID=906aefe9-76a7-4f65-b82d-5ec20775d5aa

# Username/password sign-in (works in every environment, alongside SSO). Change these as needed.
LOCAL_LOGIN_USERNAME=bharath
LOCAL_LOGIN_PASSWORD=<choose a password>

# Where the server listens. The default only accepts browsers on this machine.
# To let other machines use the app, set QM_HOST=0.0.0.0 and QM_PUBLIC_ORIGIN to the address
# users open (scheme://host[:port], no path), e.g. https://quotes.example.com or http://myhost:8081
QM_HOST=127.0.0.1
QM_PORT=8081
# QM_PUBLIC_ORIGIN=https://quotes.example.com
