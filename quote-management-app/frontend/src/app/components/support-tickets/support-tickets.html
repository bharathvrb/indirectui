<div class="container-fluid support-screen qm-page-shell">
  <section class="qm-hero-card" aria-labelledby="ticket-heading">
    <div class="qm-page-head">
      <div>
        <h1 id="ticket-heading" class="qm-title">Sales Support Tickets</h1>
        <p class="qm-subtitle mb-0 mt-1">See every quote linked to a SKY or support ticket.</p>
      </div>
    </div>
  </section>

  <form name="ticketSearch" class="card qm-filter-card mb-4" ng-submit="searchByTicket()" novalidate aria-label="Find quotes by ticket">
    <div class="card-body">
      <div class="row g-3 align-items-end qm-search-row">
        <div class="col-12 col-lg-8">
          <label for="ticket-number" class="form-label">Ticket number</label>
          <div class="qm-input-wrap">
            <i class="bi bi-ticket-detailed" aria-hidden="true"></i>
            <input id="ticket-number" type="search" class="form-control" ng-model="ticketNumber"
                   placeholder="SKY or support ticket number, e.g. SUP-TKT-20260423-002" aria-describedby="ticket-feedback"
                   ng-attr-aria-invalid="{{!!validationError}}">
          </div>
        </div>
        <div class="col-12 col-lg-4 d-flex flex-wrap gap-2">
          <button type="submit" class="btn btn-primary"><i class="bi bi-search me-1" aria-hidden="true"></i>Search</button>
          <button type="button" class="btn btn-outline-secondary" ng-click="clearSearch()">Clear</button>
          <button type="button" class="btn btn-outline-primary" ng-if="searched" ng-click="refresh()"
                  aria-label="Refresh current ticket results"><i class="bi bi-arrow-clockwise me-1" aria-hidden="true"></i>Refresh</button>
        </div>
      </div>
      <div id="ticket-feedback" class="text-danger small mt-2" role="alert" ng-if="validationError">{{validationError}}</div>
    </div>
  </form>

  <quote-table rows="results" loading="loading" error="error" tracking-id="trackingId" ready="dataReady"
               current-page="currentPage" total-pages="totalPages" total-elements="totalElements" page-size="pageSize"
               empty-message="No quotes found for this ticket"
               idle-message="Enter a ticket number to see its linked quotes."
               on-page="goToPage(page)" on-retry="refresh()"></quote-table>
</div>
